<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZWiM-Guardian | Passwort Tool</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --border: #334155;
            --danger: #ef4444;
            --warning: #eab308;
            --success: #22c55e;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- BLUR & OVERLAY SYSTEM --- */
        .blur-target {
            filter: blur(12px);
            pointer-events: none;
            user-select: none;
            transition: filter 1s var(--ease);
        }
        body.system-active .blur-target {
            filter: blur(0);
            pointer-events: auto;
            user-select: auto;
        }

        #welcome-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s var(--ease), visibility 0.8s;
        }
        body.system-active #welcome-overlay {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .welcome-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .welcome-card h2 { font-size: 1.5rem; margin-bottom: 15px; color: #fff; }
        .welcome-card p { font-size: 0.95rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 25px; }

        /* --- HAUPTAPP STYLING --- */
        .container {
            width: 100%;
            max-width: 500px;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        .header { text-align: center; margin-bottom: 25px; }
        h1 { font-size: 1.5rem; margin: 0; color: #fff; }
        .version { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .section { margin-top: 25px; padding-top: 25px; border-top: 1px solid var(--border); }
        h2 { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 15px; text-transform: uppercase; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 12px; background: #0f172a; border: 1px solid var(--border);
            border-radius: 8px; color: #fff; box-sizing: border-box; margin-bottom: 10px;
        }
        .checkbox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        button {
            width: 100%; padding: 12px; background: var(--accent); border: none;
            border-radius: 8px; color: #fff; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        button:hover { background: var(--accent-hover); }
        .strength-meter { height: 6px; background: var(--border); border-radius: 3px; margin: 15px 0; overflow: hidden; }
        #meter-bar { height: 100%; width: 0%; transition: 0.3s; }
        #status-text { font-size: 0.8rem; text-align: right; color: var(--text-muted); }
    </style>
</head>
<body>

    <!-- Hintergrundmusik -->
    <audio id="bgSound" preload="auto" loop>
        <source src="background.mp3" type="audio/mpeg">
    </audio>

    <!-- Willkommens-Popup / Blur-Layer -->
    <div id="welcome-overlay">
        <div class="welcome-card">
            <h2>ZWiM-Guardian</h2>
            <p>Aus Überzeugung lokal, Open Source und mit ganz viel Liebe gemacht. Ein exklusives Tool der <strong>ProjectZWiM</strong> Gruppe für deine Sicherheit.</p>
            <button onclick="initSystem()">System starten & Musik einschalten</button>
        </div>
    </div>

    <!-- Die eigentliche App (wird anfangs geblurred) -->
    <div class="container blur-target">
        <div class="header">
            <h1>ZWiM-Guardian</h1>
            <div class="version">ProjectZWiM — vFULL_0.0.1</div>
        </div>

        <div class="generator">
            <h2>Generator</h2>
            <input type="range" id="len-slider" min="6" max="64" value="16" oninput="document.getElementById('len-val').innerText=this.value">
            <div style="font-size: 0.8rem; margin-bottom: 10px;">Länge: <span id="len-val">16</span></div>
            <div class="checkbox-grid">
                <label><input type="checkbox" id="up" checked> A-Z</label>
                <label><input type="checkbox" id="lo" checked> a-z</label>
                <label><input type="checkbox" id="num" checked> 0-9</label>
                <label><input type="checkbox" id="sym" checked> !@#</label>
            </div>
            <button onclick="generate()">Generieren</button>
            <input type="text" id="out" readonly style="margin-top:15px; font-family: monospace;">
        </div>

        <div class="section">
            <h2>Sicherheits-Check</h2>
            <input type="password" id="check-in" oninput="check()" placeholder="Passwort eingeben...">
            <div class="strength-meter"><div id="meter-bar"></div></div>
            <div id="status-text">Sicherheitslevel: -</div>
        </div>
    </div>

    <script>
        const bgSound = document.getElementById('bgSound');

        function initSystem() {
            // Blur entfernen & Popup ausblenden
            document.body.classList.add('system-active');

            // Audio mit sanftem Fade-In starten
            bgSound.volume = 0;
            bgSound.play().then(() => {
                fadeAudioIn(bgSound, 0.2, 2000);
            }).catch(e => console.log("Audio konnte nicht automatisch gestartet werden."));
        }

        function fadeAudioIn(audio, targetVol, duration) {
            const step = targetVol / (duration / 100);
            const fadeInterval = setInterval(() => {
                if (audio.volume < targetVol) {
                    audio.volume = Math.min(audio.volume + step, targetVol);
                } else {
                    clearInterval(fadeInterval);
                }
            }, 100);
        }

        function generate() {
            let charset = "";
            if(document.getElementById('up').checked) charset += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            if(document.getElementById('lo').checked) charset += "abcdefghijklmnopqrstuvwxyz";
            if(document.getElementById('num').checked) charset += "0123456789";
            if(document.getElementById('sym').checked) charset += "!@#$%^&*()_+-=[]{}|;:,.<>?";
            
            let res = "";
            let len = document.getElementById('len-slider').value;
            for(let i=0; i<len; i++) res += charset.charAt(Math.floor(Math.random() * charset.length));
            document.getElementById('out').value = res || "Wähle Optionen!";
        }

        function check() {
            let val = document.getElementById('check-in').value;
            let bar = document.getElementById('meter-bar');
            let txt = document.getElementById('status-text');
            if(!val) { bar.style.width = "0%"; txt.innerText = "Sicherheitslevel: -"; return; }
            
            let s = 0;
            if(val.length > 7) s++;
            if(val.length > 12) s++;
            if(/[A-Z]/.test(val) && /[a-z]/.test(val)) s++;
            if(/[0-9]/.test(val)) s++;
            if(/[^A-Za-z0-9]/.test(val)) s++;
            
            let colors = ['#ef4444', '#ef4444', '#eab308', '#eab308', '#22c55e'];
            let labels = ['Sehr schwach', 'Schwach', 'Okay', 'Sicher', 'Sehr sicher'];
            
            bar.style.width = (s * 20) + "%";
            bar.style.backgroundColor = colors[s-1] || '#ef4444';
            txt.innerText = "Sicherheitslevel: " + (labels[s-1] || "Sehr schwach");
        }
        
        generate();
    </script>
</body>
</html>
